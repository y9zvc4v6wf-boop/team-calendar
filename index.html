<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning Équipe — TT, Congés & KPI</title>

  <!-- Firebase Web SDK (v8 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <!-- Chart.js pour les graphiques KPI -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #1e40af;
      --text: #ffffff;
      --border: #334155;
      --weekend-bg: #0f172a;
      
      /* Couleurs des statuts */
      --color-CA: #c2410c;
      --color-JDR: #b45309;
      --color-TT: #0369a1;
      --color-LAD: #4d7c0f;
      --color-CAR: #6d28d9;
      --color-ALE: #be123c;
      --color-ARA: #047857;
      --color-CGR: #a21caf;
      --color-SPA: #0284c7;
      --color-NKE: #e11d48;
      --color-WAT: #2563eb;
      --color-LVL: #d97706;
      --color-HBG: #4338ca;
      --color-VLD: #15803d;
    }

    * { box-sizing: border-box; }
    body {
      font-family: Calibri, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      background: var(--card);
      padding: 15px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .user-greeting {
      font-weight: bold;
      font-size: 1.1rem;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .manager-badge {
      background: #eab308;
      color: #1e293b;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    select, input[type="text"], input[type="password"] {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      width: 100%;
    }

    button {
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
    }

    button:hover { border-color: var(--accent); }

    .month-title {
      font-size: 1.2rem;
      font-weight: bold;
      min-width: 160px;
      text-align: center;
      text-transform: capitalize;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      min-width: 150px;
    }
    
    .tab-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .tab-btn.danger { background: #e11d48; color: white; border-color: #be123c; }
    .tab-btn.danger:hover { background: #be123c; }

    /* AUTH & FORMULAIRES */
    .form-box {
      background: var(--card);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid var(--border);
      max-width: 400px;
      margin: 40px auto;
      text-align: center;
    }
    .form-box h2 { margin-top: 0; color: #ffffff; }
    .form-box p { color: #ffffff; font-size: 0.9rem; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; color: #ffffff; }
    
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      text-align: left;
      cursor: pointer;
      color: #ffffff;
    }
    .checkbox-group input {
      width: auto;
      transform: scale(1.2);
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent); color: white; width: 100%; padding: 12px;
      font-weight: bold; border: none; border-radius: 6px; font-size: 1rem; margin-top: 10px;
    }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary {
      background: transparent; color: var(--text); width: 100%; padding: 12px;
      font-weight: bold; border: 1px solid var(--border); border-radius: 6px; margin-top: 10px;
    }
    .btn-outline {
      background: transparent; color: #ffffff; border: 1px solid var(--accent);
      width: 100%; padding: 12px; font-weight: bold; border-radius: 6px; margin-top: 10px;
    }
    .btn-outline:hover { background: rgba(30, 64, 175, 0.15); }

    /* BARRE D'OUTILS */
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; padding: 15px;
      background: var(--card); border-radius: 12px; border: 1px solid var(--border); align-items: center;
    }
    .toolbar span { font-weight: bold; margin-right: 5px; width: 100%; margin-bottom: 5px; color: #ffffff; }
    .tool-btn {
      padding: 6px 12px; font-weight: bold; border: 2px solid transparent;
      transition: transform 0.1s, border-color 0.2s; font-size: 0.85rem; color: #ffffff;
    }
    .tool-btn.active { border-color: #fff; transform: scale(1.08); box-shadow: 0 0 8px rgba(255,255,255,0.4); }

    /* Couleurs Boutons & Badges */
    .tool-CA  { background: var(--color-CA); }
    .tool-JDR { background: var(--color-JDR); }
    .tool-TT  { background: var(--color-TT); }
    .tool-LAD { background: var(--color-LAD); }
    .tool-CAR { background: var(--color-CAR); }
    .tool-ALE { background: var(--color-ALE); }
    .tool-ARA { background: var(--color-ARA); }
    .tool-CGR { background: var(--color-CGR); }
    .tool-SPA { background: var(--color-SPA); }
    .tool-NKE { background: var(--color-NKE); }
    .tool-WAT { background: var(--color-WAT); }
    .tool-LVL { background: var(--color-LVL); }
    .tool-HBG { background: var(--color-HBG); }
    .tool-VLD { background: var(--color-VLD); }
    .tool-PRESENT { background: #334155; border: 1px solid #475569; }

    .bg-CA  { background: var(--color-CA); }
    .bg-JDR { background: var(--color-JDR); }
    .bg-TT  { background: var(--color-TT); }
    .bg-LAD { background: var(--color-LAD); }
    .bg-CAR { background: var(--color-CAR); }
    .bg-ALE { background: var(--color-ALE); }
    .bg-ARA { background: var(--color-ARA); }
    .bg-CGR { background: var(--color-CGR); }
    .bg-SPA { background: var(--color-SPA); }
    .bg-NKE { background: var(--color-NKE); }
    .bg-WAT { background: var(--color-WAT); }
    .bg-LVL { background: var(--color-LVL); }
    .bg-HBG { background: var(--color-HBG); }
    .bg-VLD { background: var(--color-VLD); }

    /* GRILLES */
    .calendar-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
    }
    .day-header { text-align: center; font-weight: bold; padding: 8px; color: #ffffff; }
    .day-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      min-height: 85px; padding: 6px; display: flex; flex-direction: column;
      justify-content: space-between; cursor: pointer; transition: transform 0.1s, border-color 0.2s;
    }
    .day-card:hover { border-color: var(--accent); }
    .day-card.weekend { background: var(--weekend-bg); opacity: 0.5; cursor: not-allowed; }
    
    .day-card.today {
      border: 2px solid var(--accent);
      transform: translateY(-2px);
      box-shadow: 
        0 4px 14px rgba(30, 64, 175, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
      background: linear-gradient(135deg, rgba(30, 41, 59, 1) 0%, rgba(30, 64, 175, 0.15) 100%);
      z-index: 2;
    }

    .day-num { font-weight: bold; font-size: 0.85rem; margin-bottom: 2px; color: #ffffff; }
    
    .status-badge {
      font-size: 0.75rem; padding: 2px 4px; border-radius: 4px; text-align: center;
      font-weight: bold; color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    /* Demi-journées */
    .halves-container {
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex-grow: 1;
    }
    .day-half {
      background: rgba(15, 23, 42, 0.4);
      border: 1px dashed var(--border);
      border-radius: 4px;
      padding: 2px 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      min-height: 24px;
      font-size: 0.7rem;
      color: #ffffff;
    }
    .day-half:hover {
      border-color: var(--accent);
      background: rgba(30, 64, 175, 0.15);
    }

    /* Application stricte des couleurs de fond sur les demi-journées */
    .day-half.bg-CA  { background: var(--color-CA) !important; border-color: var(--color-CA); }
    .day-half.bg-JDR { background: var(--color-JDR) !important; border-color: var(--color-JDR); }
    .day-half.bg-TT  { background: var(--color-TT) !important; border-color: var(--color-TT); }
    .day-half.bg-LAD { background: var(--color-LAD) !important; border-color: var(--color-LAD); }
    .day-half.bg-CAR { background: var(--color-CAR) !important; border-color: var(--color-CAR); }
    .day-half.bg-ALE { background: var(--color-ALE) !important; border-color: var(--color-ALE); }
    .day-half.bg-ARA { background: var(--color-ARA) !important; border-color: var(--color-ARA); }
    .day-half.bg-CGR { background: var(--color-CGR) !important; border-color: var(--color-CGR); }
    .day-half.bg-SPA { background: var(--color-SPA) !important; border-color: var(--color-SPA); }
    .day-half.bg-NKE { background: var(--color-NKE) !important; border-color: var(--color-NKE); }
    .day-half.bg-WAT { background: var(--color-WAT) !important; border-color: var(--color-WAT); }
    .day-half.bg-LVL { background: var(--color-LVL) !important; border-color: var(--color-LVL); }
    .day-half.bg-HBG { background: var(--color-HBG) !important; border-color: var(--color-HBG); }
    .day-half.bg-VLD { background: var(--color-VLD) !important; border-color: var(--color-VLD); }

    .team-subnav {
      display: flex; align-items: center; gap: 10px; margin-bottom: 15px;
      background: var(--card); padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border); flex-wrap: wrap;
    }
    .team-subnav button.active { background: var(--accent); color: white; font-weight: bold; }
    
    .team-table-wrapper {
      overflow-x: auto; background: var(--card); border-radius: 12px; border: 1px solid var(--border); padding: 15px;
    }
    .month-section { margin-bottom: 25px; }
    .month-section-title { font-size: 1.1rem; font-weight: bold; color: #ffffff; text-transform: capitalize; margin-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { border: 1px solid var(--border); padding: 6px 2px; text-align: center; min-width: 36px; color: #ffffff; }
    th { background: #0f172a; color: #ffffff; }
    th.weekend-header, td.weekend-cell { background: rgba(15, 23, 42, 0.6); color: #ffffff; }
    
    th.today-header { 
      background: var(--accent); 
      color: white; 
      font-weight: bold; 
      border: 2px solid var(--accent);
      box-shadow: 0 2px 8px rgba(30, 64, 175, 0.4);
    }
    td.today-cell { 
      background: rgba(30, 64, 175, 0.15); 
      border: 2px solid var(--accent);
      box-shadow: inset 0 0 6px rgba(30, 64, 175, 0.4);
    }

    .member-col { text-align: left; padding-left: 12px; font-weight: bold; min-width: 160px; position: sticky; left: 0; background: var(--card); z-index: 2; color: #ffffff; }
    .member-pit { font-size: 0.75rem; color: #ffffff; font-weight: normal; }
    .mini-badge {
      font-weight: bold; padding: 1px 3px; border-radius: 3px; font-size: 0.65rem;
      color: white; text-shadow: 0 1px 1px rgba(0,0,0,0.4); display: inline-block; width: 100%;
    }

    /* Styles spécifiques page KPI */
    .kpi-charts-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }
    .chart-box {
      background: var(--card);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .chart-box h3 {
      color: white;
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 1.1rem;
    }
    @media (max-width: 850px) {
      .kpi-charts-container { grid-template-columns: 1fr; }
    }

    .storage-banner {
      background: #334155; padding: 8px 12px; border-radius: 6px; font-size: 0.8rem;
      margin-bottom: 15px; color: #ffffff; display: flex; justify-content: space-between;
    }

    .view { display: none; }
    .view.active { display: block; }

  </style>
</head>
<body>

  <div class="container">
    <div class="storage-banner">
      <span id="storage-info">Connexion en cours...</span>
    </div>

    <!-- HEADER COMMUN -->
    <header id="main-header" style="display: none;">
      <div class="user-greeting" id="header-greeting"></div>

      <div class="nav-controls" id="month-nav">
        <button id="prev-month">◄</button>
        <div class="month-title" id="month-display">-</div>
        <button id="next-month">►</button>
      </div>
    </header>

    <!-- ONGLETS DE NAVIGATION -->
    <div class="tabs" id="main-tabs" style="display: none;">
      <button class="tab-btn" id="tab-personal" onclick="switchTab('view-personal')">Mon Calendrier</button>
      <button class="tab-btn" id="tab-team" onclick="switchTab('view-team')">Vue Équipe</button>
      <button class="tab-btn" id="tab-kpi" onclick="switchTab('view-kpi')">📊 KPI</button>
      <button class="tab-btn" id="tab-settings" onclick="switchTab('view-settings')">⚙️ Gestion Code</button>
      <button class="tab-btn danger" onclick="logout()">Déconnexion</button>
    </div>

    <!-- ============================== -->
    <!-- VUE : CONNEXION                -->
    <!-- ============================== -->
    <div id="view-login" class="view active">
      <div class="form-box">
        <h2>🔒 Connexion</h2>
        <p>Sélectionnez votre nom et entrez votre code PIN à 4 chiffres.</p>
        
        <div class="form-group">
          <label for="login-name">Sélectionnez votre nom :</label>
          <select id="login-name">
            <option value="">-- Aucun profil (Créez-en un) --</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="login-pin">Code PIN (4 chiffres) :</label>
          <input type="password" id="login-pin" maxlength="4" placeholder="Ex: 1234" pattern="\d{4}">
        </div>
        
        <button class="btn-primary" onclick="handleLogin()">Se connecter</button>
        <button class="btn-outline" onclick="showCreateProfile()">➕ Créer un profil</button>
        <button class="btn-secondary" onclick="accessPublicTeamView()">👀 Voir la Vue Équipe & KPI (Public)</button>
      </div>
    </div>

    <!-- ============================== -->
    <!-- VUE : CRÉER UN PROFIL          -->
    <!-- ============================== -->
    <div id="view-create-profile" class="view">
      <div class="form-box">
        <h2>👤 Nouveau Profil</h2>
        
        <div class="form-group">
          <label for="cp-firstname">Prénom :</label>
          <input type="text" id="cp-firstname" placeholder="Ex: Jean">
        </div>
        
        <div class="form-group">
          <label for="cp-lastname">Nom :</label>
          <input type="text" id="cp-lastname" placeholder="Ex: Dupont">
        </div>
        
        <div class="form-group">
          <label for="cp-pit">PIT (Équipe / Service) :</label>
          <select id="cp-pit">
            <option value="PIT Archi">PIT Archi</option>
            <option value="PIT CAC">PIT CAC</option>
            <option value="PIT Prep">PIT Prep</option>
            <option value="PIT TBM">PIT TBM</option>
          </select>
        </div>

        <label class="checkbox-group">
          <input type="checkbox" id="cp-manager">
          <strong>Je suis Manager</strong>
        </label>
        
        <div class="form-group">
          <label for="cp-pin">Code PIN (4 chiffres) :</label>
          <input type="password" id="cp-pin" maxlength="4" placeholder="Ex: 1234">
        </div>
        
        <button class="btn-primary" onclick="handleCreateProfile()">Créer le profil</button>
        <button class="btn-secondary" onclick="switchTab('view-login')">Annuler</button>
      </div>
    </div>

    <!-- ============================== -->
    <!-- VUE : GESTION (MODIFIER CODE)  -->
    <!-- ============================== -->
    <div id="view-settings" class="view">
      <div class="form-box">
        <h2>⚙️ Modifier mon Code PIN</h2>
        <div class="form-group">
          <label for="old-pin">Ancien code :</label>
          <input type="password" id="old-pin" maxlength="4">
        </div>
        <div class="form-group">
          <label for="new-pin">Nouveau code :</label>
          <input type="password" id="new-pin" maxlength="4">
        </div>
        <button class="btn-primary" onclick="changePin()">Valider la modification</button>
      </div>
    </div>

    <!-- ============================== -->
    <!-- VUE : MON CALENDRIER           -->
    <!-- ============================== -->
    <div id="view-personal" class="view">
      <div class="toolbar">
        <span>Sélectionner le type de jour à appliquer :</span>
        <button class="tool-btn tool-CA active" data-status="CA">CA</button>
        <button class="tool-btn tool-JDR" data-status="JDR">JDR</button>
        <button class="tool-btn tool-TT" data-status="TT">TT</button>
        <button class="tool-btn tool-LAD" data-status="LAD">LAD</button>
        <button class="tool-btn tool-CAR" data-status="CAR">CAR</button>
        <button class="tool-btn tool-ALE" data-status="ALE">ALE</button>
        <button class="tool-btn tool-ARA" data-status="ARA">ARA</button>
        <button class="tool-btn tool-CGR" data-status="CGR">CGR</button>
        <button class="tool-btn tool-SPA" data-status="SPA">SPA</button>
        <button class="tool-btn tool-NKE" data-status="NKE">NKE</button>
        <button class="tool-btn tool-WAT" data-status="WAT">WAT</button>
        <button class="tool-btn tool-LVL" data-status="LVL">LVL</button>
        <button class="tool-btn tool-HBG" data-status="HBG">HBG</button>
        <button class="tool-btn tool-VLD" data-status="VLD">VLD</button>
        <button class="tool-btn tool-PRESENT" data-status="PRESENT">🗑️ Effacer (Bureau)</button>
      </div>
      <div class="calendar-grid" id="personal-grid"></div>
    </div>

    <!-- ============================== -->
    <!-- VUE : VUE ÉQUIPE               -->
    <!-- ============================== -->
    <div id="view-team" class="view">
      <button class="btn-secondary" id="btn-back-login" style="margin-bottom: 20px; width: auto; display: none;" onclick="logout()">◄ Retour à la connexion</button>
      
      <div class="team-subnav">
        <span style="font-weight: bold; font-size: 0.9rem; color: #ffffff;">Période :</span>
        <button id="btn-team-1m" class="active">1 Mois</button>
        <button id="btn-team-3m">3 Mois (Trimestre)</button>

        <span style="font-weight: bold; font-size: 0.9rem; margin-left: 15px; color: #ffffff;">Filtre PIT :</span>
        <select id="pit-select-filter">
          <option value="ALL">Tous les PITs</option>
        </select>
      </div>
      <div class="team-table-wrapper" id="team-table-container"></div>
    </div>

    <!-- ============================== -->
    <!-- VUE : KPI (Graphiques)         -->
    <!-- ============================== -->
    <div id="view-kpi" class="view">
      <button class="btn-secondary" id="btn-back-login-kpi" style="margin-bottom: 20px; width: auto; display: none;" onclick="logout()">◄ Retour à la connexion</button>
      
      <div class="team-subnav">
        <span style="font-weight: bold; font-size: 0.9rem; color: #ffffff;">Période (Déplacements) :</span>
        <select id="kpi-year" style="width: auto;"></select>
        <select id="kpi-month" style="width: auto;">
          <option value="ALL">Année Complète</option>
          <option value="0">Janvier</option>
          <option value="1">Février</option>
          <option value="2">Mars</option>
          <option value="3">Avril</option>
          <option value="4">Mai</option>
          <option value="5">Juin</option>
          <option value="6">Juillet</option>
          <option value="7">Août</option>
          <option value="8">Septembre</option>
          <option value="9">Octobre</option>
          <option value="10">Novembre</option>
          <option value="11">Décembre</option>
        </select>
        <button class="btn-primary" style="width: auto; margin-top: 0; padding: 8px 16px;" onclick="renderKPICharts()">Actualiser</button>
      </div>

      <div class="kpi-charts-container">
        <!-- Graphique par Personne -->
        <div class="chart-box">
          <h3>Déplacements par Personne (Jours)</h3>
          <canvas id="kpi-person-chart"></canvas>
        </div>
        <!-- Graphique par PIT -->
        <div class="chart-box">
          <h3>Répartition par PIT (Jours)</h3>
          <canvas id="kpi-pit-chart"></canvas>
        </div>
      </div>
    </div>

  </div>

<script>
  /* =========================================================================
     1. CONFIGURATION FIREBASE & DONNÉES
     ========================================================================= */
  const firebaseConfig = {
    apiKey: "AIzaSyBgcDyREaj8-mwazuCR4OPxwYqxPOI4m0Q",
    authDomain: "calendrier-team.firebaseapp.com",
    databaseURL: "https://calendrier-team-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "calendrier-team",
    storageBucket: "calendrier-team.firebasestorage.app",
    messagingSenderId: "731538256737",
    appId: "1:731538256737:web:26fabb6197ee8bc95e4b20"
  };

  const BASE_TEAM_MEMBERS = [];

  /* VARIABLES GLOBALES */
  let currentUser = null; 
  let currentDate = new Date();

  /* =========================================================================
     3. GESTION DU JOUR ACTUEL & STATUTS
     ========================================================================= */
  const nowRef = new Date();
  const todayYear = nowRef.getFullYear();
  const todayMonth = nowRef.getMonth();
  const todayDate = nowRef.getDate();

  function isToday(dateObj) {
    return dateObj.getFullYear() === todayYear &&
           dateObj.getMonth() === todayMonth &&
           dateObj.getDate() === todayDate;
  }

  // Détermine si une date se trouve dans la semaine actuelle ou la semaine prochaine
  function isCurrentOrNextWeek(dateObj) {
    const n = new Date(nowRef.getFullYear(), nowRef.getMonth(), nowRef.getDate());
    const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());

    // Obtenir le Lundi de la semaine en cours
    let dayOfWeek = n.getDay();
    let diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
    let currentWeekMonday = new Date(n);
    currentWeekMonday.setDate(n.getDate() + diffToMonday);

    // Fin de la semaine prochaine (Dimanche de la semaine suivante)
    let nextWeekSunday = new Date(currentWeekMonday);
    nextWeekSunday.setDate(currentWeekMonday.getDate() + 13);

    return d >= currentWeekMonday && d <= nextWeekSunday;
  }

  function getStatus(dateKey, user, slot = null) {
    const dayVal = calendarData[dateKey] && calendarData[dateKey][user];
    if (!dayVal) return 'PRESENT';
    if (typeof dayVal === 'string') {
      return dayVal;
    }
    if (typeof dayVal === 'object') {
      if (slot) return dayVal[slot] || 'PRESENT';
      return dayVal.am || dayVal.pm || 'PRESENT';
    }
    return 'PRESENT';
  }

  function setStatus(dateKey, user, tool, slot = null) {
    if (!calendarData[dateKey]) calendarData[dateKey] = {};
    let current = calendarData[dateKey][user];
    
    if (slot !== null) {
      let obj = {};
      if (typeof current === 'object' && current !== null) {
        obj = { ...current };
      } else if (typeof current === 'string') {
        obj = { am: current, pm: current };
      } else {
        obj = { am: 'PRESENT', pm: 'PRESENT' };
      }

      if (tool === 'PRESENT') {
        delete obj[slot];
      } else {
        obj[slot] = tool;
      }

      if ((!obj.am || obj.am === 'PRESENT') && (!obj.pm || obj.pm === 'PRESENT')) {
        delete calendarData[dateKey][user];
      } else {
        calendarData[dateKey][user] = obj;
      }
    } else {
      if (tool === 'PRESENT') {
        delete calendarData[dateKey][user];
      } else {
        calendarData[dateKey][user] = tool;
      }
    }

    if (Object.keys(calendarData[dateKey]).length === 0) {
      delete calendarData[dateKey];
    }
  }

  function populateDropdowns() {
    const userSelect = document.getElementById('login-name');
    userSelect.innerHTML = '';
    
    if (ALL_MEMBERS.length === 0) {

      opt.value = "";

    } else {

        opt.textContent = `${user.firstName} ${user.lastName} (${user.pit})${user.isManager ? ' [Manager]' : ''}`;
        userSelect.appendChild(opt);
      });
    }

    const pitSelect = document.getElementById('pit-select-filter');
    const currentPitVal = pitSelect.value;
    pitSelect.innerHTML = '<option value="ALL">Tous les PITs</option>';
    const pits = [...new Set(ALL_MEMBERS.map(m => m.pit).filter(Boolean))];
    pits.forEach(pit => {
      const opt = document.createElement('option');
      opt.value = pit;
      opt.textContent = pit;
      pitSelect.appendChild(opt);
    });
    if (pits.includes(currentPitVal) || currentPitVal === 'ALL') pitSelect.value = currentPitVal;
  }

  function handleLogin() {
    const name = document.getElementById('login-name').value;
    const pin = document.getElementById('login-pin').value;
    
    if (!name) { alert("Aucun utilisateur sélectionné ou aucun profil disponible."); return; }
    if (!/^\d{4}$/.test(pin)) { alert("Veuillez entrer un code PIN à 4 chiffres."); return; }

    if (!usersPins[name]) {
      if(confirm(`Créer le mot de passe pour ${name} avec le code ${pin} ?`)) {
        usersPins[name] = pin;
        savePinData();
        loginSuccess(name);
      }
    } else {
      if (usersPins[name] === pin) {
        loginSuccess(name);
      } else {
        alert("Code PIN incorrect !");
      }
    }
  }

  function loginSuccess(name) {
    currentUser = name;
    document.getElementById('login-pin').value = ''; 
    
    const userObj = ALL_MEMBERS.find(m => m.firstName === name);
    let greetingHtml = `Bonjour, ${currentUser}`;
    if (userObj && userObj.isManager) {
      greetingHtml += ` <span class="manager-badge">Manager</span>`;
    }

    document.getElementById('main-header').style.display = 'flex';
    document.getElementById('main-tabs').style.display = 'flex';
    document.getElementById('header-greeting').innerHTML = greetingHtml;
    
    document.getElementById('btn-back-login').style.display = 'none';

    document.getElementById('tab-personal').style.display = 'block';
    document.getElementById('tab-settings').style.display = 'block';
    document.getElementById('tab-team').style.display = 'block';
    document.getElementById('tab-kpi').style.display = 'block';

  }

  function handleCreateProfile() {
    const firstName = document.getElementById('cp-firstname').value.trim();
    const lastName = document.getElementById('cp-lastname').value.trim();
    const pit = document.getElementById('cp-pit').value;
    const isManager = document.getElementById('cp-manager').checked;
    const pin = document.getElementById('cp-pin').value;

    if (!firstName || !lastName || !pit) {
      alert("Veuillez remplir le Prénom et le Nom."); return;
    }
    if (!/^\d{4}$/.test(pin)) {
      alert("Le code PIN doit contenir exactement 4 chiffres."); return;
    }
    if (ALL_MEMBERS.some(m => m.firstName.toLowerCase() === firstName.toLowerCase())) {
      alert("Un utilisateur avec ce prénom existe déjà ! Utilisez un prénom différent."); return;
    }

    customMembers.push({ pit, firstName, lastName, isManager });
    saveCustomUsers();

    usersPins[firstName] = pin;
    savePinData();

    document.getElementById('cp-firstname').value = '';
    document.getElementById('cp-lastname').value = '';
    document.getElementById('cp-pit').value = 'PIT Archi';
    document.getElementById('cp-manager').checked = false;
    document.getElementById('cp-pin').value = '';

    alert("Profil créé avec succès ! Vous pouvez maintenant vous connecter.");
    updateAllMembersList();
    
    setTimeout(() => {
      document.getElementById('login-name').value = firstName;
      switchTab('view-login');
    }, 100);
  }

  /* =========================================================================
     6. KPI - CALCULS & GRAPHIQUES (CHART.JS)
     ========================================================================= */
  function populateKPIFilters() {
    const yearSelect = document.getElementById('kpi-year');
    if(yearSelect.options.length > 0) return;
    
    const currentYear = new Date().getFullYear();
    for(let y = currentYear - 1; y <= currentYear + 2; y++) {
      const opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y;
      if (y === currentYear) opt.selected = true;
      yearSelect.appendChild(opt);
    }
  }

  function calculateKPIData(selectedYear, selectedMonth) {
    let personStats = {};
    let pitStats = {};

    ALL_MEMBERS.forEach(m => {
      personStats[m.firstName] = 0;
      if (!pitStats[m.pit]) pitStats[m.pit] = 0;
    });

    Object.keys(calendarData).forEach(dateKey => {
      const [dYear, dMonthStr, dDay] = dateKey.split('-');
      
      if (parseInt(dYear) !== parseInt(selectedYear)) return;
      if (selectedMonth !== 'ALL' && (parseInt(dMonthStr) - 1) !== parseInt(selectedMonth)) return;

      const dayData = calendarData[dateKey];
      Object.keys(dayData).forEach(user => {
        const status = dayData[user];
        let daysToAdd = 0;

        if (typeof status === 'string') {
          if (DISPLACEMENT_CODES.includes(status)) daysToAdd = 1;
        } else if (typeof status === 'object') {
          if (DISPLACEMENT_CODES.includes(status.am)) daysToAdd += 0.5;
          if (DISPLACEMENT_CODES.includes(status.pm)) daysToAdd += 0.5;
        }

        if (daysToAdd > 0 && personStats[user] !== undefined) {
          personStats[user] += daysToAdd;
          const userObj = ALL_MEMBERS.find(m => m.firstName === user);
          if (userObj) {
            pitStats[userObj.pit] += daysToAdd;
          }
        }
      });
    });

    return { personStats, pitStats };
  }

  function renderKPICharts() {
    if (!document.getElementById('view-kpi').classList.contains('active')) return;
    
    const year = document.getElementById('kpi-year').value;
    const month = document.getElementById('kpi-month').value;

    const { personStats, pitStats } = calculateKPIData(year, month);

    if (kpiPersonChart) kpiPersonChart.destroy();
    if (kpiPitChart) kpiPitChart.destroy();

    const personLabels = Object.keys(personStats);
    const personData = Object.values(personStats);

    const ctxPerson = document.getElementById('kpi-person-chart').getContext('2d');
    
    Chart.defaults.color = '#cbd5e1'; 
    Chart.defaults.borderColor = '#334155';

    kpiPersonChart = new Chart(ctxPerson, {
      type: 'bar',
      data: {
        labels: personLabels,
        datasets: [{
          label: 'Jours de déplacement',
          data: personData,
          backgroundColor: 'rgba(37, 99, 235, 0.8)',
          borderColor: 'rgba(37, 99, 235, 1)',
          borderWidth: 1,
          borderRadius: 4
        }]
      },
      options: {
        responsive: true,
        scales: {
          y: { 
            beginAtZero: true, 
            ticks: { stepSize: 1 }
          }
        },
        plugins: {
          legend: { display: false }
        }
      }
    });

    const pitLabels = Object.keys(pitStats);
    const pitData = Object.values(pitStats);

    const ctxPit = document.getElementById('kpi-pit-chart').getContext('2d');
    kpiPitChart = new Chart(ctxPit, {
      type: 'doughnut',
      data: {
        labels: pitLabels,
        datasets: [{
          label: 'Jours de déplacement',
          data: pitData,
          backgroundColor: [
            '#0ea5e9', '#10b981', '#f59e0b', '#ef4444', 
            '#8b5cf6', '#ec4899', '#14b8a6', '#6366f1'
          ],
          borderColor: '#1e293b',
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: 'right' }
        }
      }
    });
  }


  /* =========================================================================
     7. MOTEUR DU CALENDRIER
     ========================================================================= */
  function applyStatus(dateStr, slot = null) {
    if (!currentUser) return; 
    setStatus(dateStr, currentUser, selectedTool, slot);

    if (db) {
      db.ref('planning').set(calendarData);
    } else {
      localStorage.setItem('team_calendar_data', JSON.stringify(calendarData));
      renderViews();
    }
  }

  function renderViews() {
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    const monthFormatter = new Intl.DateTimeFormat('fr-FR', { month: 'long', year: 'numeric' });
    document.getElementById('month-display').textContent = monthFormatter.format(currentDate);

    if(document.getElementById('view-personal').classList.contains('active')) renderPersonalCalendar(year, month);
    if(document.getElementById('view-team').classList.contains('active')) renderTeamCalendar(year, month);
    if(document.getElementById('view-kpi').classList.contains('active')) renderKPICharts();
  }

  function renderPersonalCalendar(year, month) {
    const grid = document.getElementById('personal-grid');
    grid.innerHTML = '';

    const daysOfWeek = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];
    daysOfWeek.forEach(d => {
      const header = document.createElement('div');
      header.className = 'day-header';
      header.textContent = d;
      grid.appendChild(header);
    });

    const firstDayOfMonth = new Date(year, month, 1);
    const lastDayOfMonth = new Date(year, month + 1, 0);
    
    let startingDay = firstDayOfMonth.getDay();
    startingDay = startingDay === 0 ? 6 : startingDay - 1;

    for (let i = 0; i < startingDay; i++) {
      const emptyCard = document.createElement('div');
      emptyCard.className = 'day-card weekend';
      grid.appendChild(emptyCard);
    }

    for (let day = 1; day <= lastDayOfMonth.getDate(); day++) {
      const dateObj = new Date(year, month, day);
      const card = document.createElement('div');
      card.className = 'day-card';

      const yearStr = dateObj.getFullYear();
      const monthStr = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dayStr = String(dateObj.getDate()).padStart(2, '0');
      const dateKey = `${yearStr}-${monthStr}-${dayStr}`;

      if (isToday(dateObj)) card.classList.add('today');

      const isWeekend = dateObj.getDay() === 0 || dateObj.getDay() === 6;
      if (isWeekend) {
        card.classList.add('weekend');
      }

      const numDiv = document.createElement('div');
      numDiv.className = 'day-num';
      numDiv.textContent = day;
      card.appendChild(numDiv);

      if (!isWeekend) {
        // Condition : Si c'est la semaine actuelle ou la semaine suivante, on découpe en Matin / Après-midi
        if (isCurrentOrNextWeek(dateObj)) {
          const halvesContainer = document.createElement('div');
          halvesContainer.className = 'halves-container';

          ['am', 'pm'].forEach((slot, index) => {
            const halfDiv = document.createElement('div');
            halfDiv.className = 'day-half';
            const slotLabel = index === 0 ? 'Matin' : 'Après-midi';
            
            const currentStatus = getStatus(dateKey, currentUser, slot);
            if (currentStatus && currentStatus !== 'PRESENT') {
              halfDiv.className += ` bg-${currentStatus}`;
              const badge = document.createElement('span');
              badge.className = 'status-badge';
              badge.textContent = currentStatus;
              halfDiv.appendChild(badge);
            } else {
              halfDiv.textContent = slotLabel;
            }

            halfDiv.onclick = (e) => {
              e.stopPropagation();
              applyStatus(dateKey, slot);
            };

            halvesContainer.appendChild(halfDiv);
          });
          card.appendChild(halvesContainer);
        } else {
          // Pour les semaines plus éloignées : vue journée entière
          const wholeDayDiv = document.createElement('div');
          wholeDayDiv.style.flexGrow = '1';
          wholeDayDiv.style.display = 'flex';
          wholeDayDiv.style.alignItems = 'center';
          wholeDayDiv.style.justifyContent = 'center';
          wholeDayDiv.style.fontSize = '0.85rem';
          wholeDayDiv.style.fontWeight = 'bold';

          const currentStatus = getStatus(dateKey, currentUser, null);
          if (currentStatus && currentStatus !== 'PRESENT') {
            wholeDayDiv.className = `status-badge bg-${currentStatus}`;
            wholeDayDiv.style.padding = '4px 8px';
            wholeDayDiv.style.margin = 'auto';
            wholeDayDiv.textContent = currentStatus;
          } else {
            wholeDayDiv.style.color = '#64748b';
            wholeDayDiv.textContent = 'Bureau';
          }

          card.onclick = () => {
            applyStatus(dateKey, null);
          };

          card.appendChild(wholeDayDiv);
        }
      } else {
        const placeholder = document.createElement('div');
        placeholder.style.fontSize = '0.8rem';
        placeholder.style.color = '#ffffff';
        placeholder.style.textAlign = 'center';
        placeholder.textContent = 'Week-end';
        card.appendChild(placeholder);
      }

      grid.appendChild(card);
    }
  }

  function renderTeamCalendar(year, month) {
    const container = document.getElementById('team-table-container');
    container.innerHTML = '';

    let monthsToRender = [];
    for (let i = 0; i < teamViewMonths; i++) {
      const d = new Date(year, month + i, 1);
      monthsToRender.push({ year: d.getFullYear(), month: d.getMonth() });
    }

    let filteredMembers = ALL_MEMBERS;
    if (selectedPit !== 'ALL') {
      filteredMembers = ALL_MEMBERS.filter(m => m.pit === selectedPit);
    }

    monthsToRender.forEach(mObj => {
      const mYear = mObj.year;
      const mMonth = mObj.month;

      const section = document.createElement('div');
      section.className = 'month-section';

      const monthTitle = document.createElement('div');
      monthTitle.className = 'month-section-title';
      const monthFormatter = new Intl.DateTimeFormat('fr-FR', { month: 'long', year: 'numeric' });
      monthTitle.textContent = monthFormatter.format(new Date(mYear, mMonth, 1));
      section.appendChild(monthTitle);

      const tableWrapper = document.createElement('div');
      const table = document.createElement('table');

      const thead = document.createElement('thead');
      const headerRow = document.createElement('tr');

      const memberTh = document.createElement('th');
      memberTh.className = 'member-col';
      memberTh.textContent = 'Membre';
      headerRow.appendChild(memberTh);

      const daysInMonth = new Date(mYear, mMonth + 1, 0).getDate();
      for (let day = 1; day <= daysInMonth; day++) {
        const th = document.createElement('th');
        const dateObj = new Date(mYear, mMonth, day);
        th.textContent = day;
        if (dateObj.getDay() === 0 || dateObj.getDay() === 6) {
          th.className = 'weekend-header';
        }
        if (isToday(dateObj)) {
          th.className += ' today-header';
        }
        headerRow.appendChild(th);
      }
      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement('tbody');
      filteredMembers.forEach(member => {
        const tr = document.createElement('tr');
        const tdMember = document.createElement('td');
        tdMember.className = 'member-col';
        tdMember.innerHTML = `${member.firstName} ${member.lastName}<br><span class="member-pit">${member.pit}</span>`;
        tr.appendChild(tdMember);

        for (let day = 1; day <= daysInMonth; day++) {
          const td = document.createElement('td');
          const dateObj = new Date(mYear, mMonth, day);
          const yearStr = dateObj.getFullYear();
          const monthStr = String(dateObj.getMonth() + 1).padStart(2, '0');
          const dayStr = String(dateObj.getDate()).padStart(2, '0');
          const dateKey = `${yearStr}-${monthStr}-${dayStr}`;

          if (dateObj.getDay() === 0 || dateObj.getDay() === 6) {
            td.className = 'weekend-cell';
          }
          if (isToday(dateObj)) {
            td.className += ' today-cell';
          }

          const statusVal = calendarData[dateKey] && calendarData[dateKey][member.firstName];
          if (statusVal) {
            if (typeof statusVal === 'string') {
              if (statusVal !== 'PRESENT') {
                td.innerHTML = `<span class="mini-badge bg-${statusVal}">${statusVal}</span>`;
              }
            } else if (typeof statusVal === 'object') {
              let html = '';
              if (statusVal.am && statusVal.am !== 'PRESENT') html += `<span class="mini-badge bg-${statusVal.am}" style="margin-bottom:1px;">${statusVal.am}</span>`;
              if (statusVal.pm && statusVal.pm !== 'PRESENT') html += `<span class="mini-badge bg-${statusVal.pm}">${statusVal.pm}</span>`;
              td.innerHTML = html;
            }
          }
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      tableWrapper.appendChild(table);
      section.appendChild(tableWrapper);
      container.appendChild(section);
    });
  }

  syncData();
</script>
</body>
</html>
